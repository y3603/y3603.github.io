<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ASA 生物所持チェックリスト</title>
<style>
:root{color-scheme:dark;--bg:#101820;--panel:#1b2935;--panel2:#243746;--line:#385064;--text:#edf4f8;--muted:#a9bbc8;--accent:#69c5a4;--accent2:#e2b86b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#101820,#182a36);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1000px;margin:auto;padding:24px 16px 48px}h1{font-size:clamp(1.35rem,4vw,2rem);margin:0 0 8px}.sub,.note{color:var(--muted);font-size:.9rem;line-height:1.6}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:16px 0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:var(--panel2);border-radius:10px;padding:12px;text-align:center}.stat strong{display:block;font-size:1.5rem;color:var(--accent)}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}input[type=search]{flex:1;min-width:190px;background:#101c25;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px;font:inherit}button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:10px 13px;font:inherit;cursor:pointer}button:hover{border-color:var(--accent)}button.danger{border-color:#875b55;color:#ffc4b8}.lang{white-space:nowrap;border-color:var(--accent);color:var(--accent)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.filters label{background:var(--panel2);padding:8px 10px;border-radius:8px;font-size:.9rem}.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px}.creature{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:54px}.creature input{width:19px;height:19px;accent-color:var(--accent);flex:none}.creature span{flex:1}.creature.checked{border-color:#45866f;background:#1b342f}.creature.checked span{text-decoration:line-through;color:#a6c7ba}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0 10px}.section-head h2{font-size:1.1rem;margin:0}.small{font-size:.82rem;color:var(--muted)}#status{margin-top:10px;color:var(--accent2);font-size:.88rem;min-height:1.3em}@media(max-width:520px){main{padding:18px 11px}.stats{gap:6px}.stat{padding:9px 5px}.stat strong{font-size:1.25rem}}
</style></head><body><main>
<div class="topbar"><h1 id="title">ASA エニグマ用生物所持チェックリスト</h1><button id="language" class="lang">English</button></div>
<p class="sub" id="subtitle">テイム可能・騎乗可能・飛行しない地上生物の所持状況を管理します。チェック状態はこのブラウザに自動保存されます。</p>
<section class="panel"><div class="stats"><div class="stat"><strong id="owned">0</strong><span id="ownedLabel">所持済み</span></div><div class="stat"><strong id="total">?</strong><span id="totalLabel">登録生物</span></div><div class="stat"><strong id="percent">0%</strong><span id="percentLabel">達成率</span></div></div>
<div class="controls"><input id="search" type="search" placeholder="生物名で検索…" aria-label="生物名で検索"><button id="all">すべて表示</button><button id="missing">未所持のみ</button><button id="done">所持済みのみ</button></div>
<div class="filters"><label><input type="checkbox" id="hideDone"> <span id="hideLabel">所持済みを一覧から隠す</span></label></div><div id="status" role="status"></div></section>
<div class="section-head"><h2 id="listTitle">生物一覧</h2><span class="small" id="shown"></span></div><div id="list" class="list">生物データを読み込み中…</div>
<section class="panel"><div class="section-head"><h2 id="manageTitle">データ管理</h2></div><p class="note" id="manageNote">チェック状態はブラウザ内に保存されます。別のPC・ブラウザには自動で同期されません。</p>
<div class="controls"><button id="export">所持状況をバックアップ</button><button id="import">バックアップを読み込む</button><button id="reset" class="danger">チェックをすべてリセット</button><input id="file" type="file" accept="application/json" hidden></div></section>
</main>

<script>
(()=>{
 const STORAGE_KEY="asa_ground_rideable_owned_v1", LANG_KEY="asa_tracker_language_v1";let creatures=[],owned=new Set(),mode="all",lang=localStorage.getItem(LANG_KEY)||"ja";
 const $=id=>document.getElementById(id),list=$("list");
 const words={ja:{title:"ASA エニグマ用生物所持チェックリスト",subtitle:"エニグマ用の生物の所持状況を管理します。チェック状態はこのブラウザに自動保存されます。",owned:"所持済み",total:"登録生物",percent:"達成率",search:"生物名で検索…",all:"すべて表示",missing:"未所持のみ",done:"所持済みのみ",hide:"所持済みを一覧から隠す",list:"生物一覧",manage:"データ管理",note:"チェック状態はブラウザ内に保存されます。別のPC・ブラウザには自動で同期されません。",export:"所持状況をバックアップ",import:"バックアップを読み込む",reset:"チェックをすべてリセット",foot:"※一覧は公式ゲーム内の出現・追加コンテンツの更新で変わる場合があります。特殊な滑空・浮遊能力を持つ生物など、分類が曖昧なものは除外または要確認としています。",loading:"生物データを読み込み中…",loadok:"生物データを読み込みました。",loaderr:"creatures.json を読み込めませんでした。HTMLとJSONを同じフォルダに置き、ローカルサーバー経由で開いてください。",empty:"該当する生物がありません。",shown:n=>`${n}件表示`,ownedAria:n=>`${n}を所持済みにする`,resetConfirm:"すべての所持チェックを解除します。よろしいですか？",resetDone:"チェックをリセットしました。",exportDone:"バックアップファイルを保存しました。",importDone:"バックアップを読み込みました。",importErr:"読み込みに失敗しました: ",formatErr:"形式が違います",statusErr:"読み込みエラー: "},en:{title:"ASA Enigma Biological Possession Checklist",subtitle:"This manages the possession status of creatures for Enigma. The check status is automatically saved in this browser.",owned:"Owned",total:"Total creatures",percent:"Completion",search:"Search creatures…",all:"Show all",missing:"Not owned",done:"Owned only",hide:"Hide owned creatures",list:"Creature List",manage:"Data Management",note:"Your checkmarks are saved in this browser and do not sync to other devices or browsers.",export:"Export backup",import:"Import backup",reset:"Reset all checks",foot:"Note: The list may change with official updates and added content. Creatures with ambiguous classifications or special gliding/levitation abilities may be excluded or require verification.",loading:"Loading creature data…",loadok:"Creature data loaded.",loaderr:"Could not load creatures.json. Keep the HTML and JSON in the same folder and open via a local web server.",empty:"No matching creatures.",shown:n=>`${n} shown`,ownedAria:n=>`Mark ${n} as owned`,resetConfirm:"Clear all ownership checks?",resetDone:"All checks have been reset.",exportDone:"Backup file saved.",importDone:"Backup imported.",importErr:"Import failed: ",formatErr:"Invalid file format",statusErr:"Loading error: "}};
 const t=()=>words[lang];
 function applyLanguage(){const w=t();document.documentElement.lang=lang;for(const [id,key] of Object.entries({title:"title",subtitle:"subtitle",ownedLabel:"owned",totalLabel:"total",percentLabel:"percent",all:"all",missing:"missing",done:"done",hideLabel:"hide",listTitle:"list",manageTitle:"manage",manageNote:"note",export:"export",import:"import",reset:"reset",})){ $(id).textContent=w[key];}$("search").placeholder=w.search;$("search").setAttribute("aria-label",w.search);$("language").textContent=lang==="ja"?"English":"日本語";$("list").textContent=creatures.length?"":"";render();}
 function loadSaved(){try{const parsed=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");owned=new Set(Array.isArray(parsed)?parsed:[])}catch{owned=new Set()}}
 function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify([...owned]))}
 function updateStats(){const count=creatures.filter(c=>owned.has(c.id)).length;$("owned").textContent=count;$("total").textContent=creatures.length;$("percent").textContent=creatures.length?Math.round(count/creatures.length*100)+"%":"0%"}
 function render(){const q=$("search").value.trim().toLocaleLowerCase();const hide=$("hideDone").checked;const filtered=creatures.filter(c=>{const en=c.name.toLocaleLowerCase(),ja=(c.name_ja||c.name).toLocaleLowerCase();const match=!q||en.includes(q)||ja.includes(q);const status=mode==="all"||(mode==="missing"&&!owned.has(c.id))||(mode==="done"&&owned.has(c.id));return match&&status&&!(hide&&owned.has(c.id))});list.replaceChildren();if(!filtered.length){list.textContent=t().empty;$("shown").textContent=t().shown(0);return}const frag=document.createDocumentFragment();filtered.forEach(c=>{const label=document.createElement("label");label.className="creature"+(owned.has(c.id)?" checked":"");const cb=document.createElement("input");cb.type="checkbox";cb.checked=owned.has(c.id);const displayName=lang==="ja"?(c.name_ja||c.name):c.name;cb.setAttribute("aria-label",t().ownedAria(displayName));cb.addEventListener("change",()=>{if(cb.checked)owned.add(c.id);else owned.delete(c.id);save();render();updateStats()});const name=document.createElement("span");name.textContent=displayName;label.append(cb,name);frag.append(label)});list.append(frag);$("shown").textContent=t().shown(filtered.length)}
 function setMode(next){mode=next;render()}
 $("language").addEventListener("click",()=>{lang=lang==="ja"?"en":"ja";localStorage.setItem(LANG_KEY,lang);applyLanguage()});$("search").addEventListener("input",render);$("hideDone").addEventListener("change",render);$("all").addEventListener("click",()=>setMode("all"));$("missing").addEventListener("click",()=>setMode("missing"));$("done").addEventListener("click",()=>setMode("done"));
 $("reset").addEventListener("click",()=>{if(confirm(t().resetConfirm)){owned.clear();save();render();updateStats();$("status").textContent=t().resetDone}});
 $("export").addEventListener("click",()=>{const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),owned:[...owned]},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="asa-owned-backup.json";a.click();URL.revokeObjectURL(a.href);$("status").textContent=t().exportDone});
 $("import").addEventListener("click",()=>$("file").click());$("file").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text()),ids=Array.isArray(obj)?obj:obj.owned;if(!Array.isArray(ids))throw new Error(t().formatErr);const valid=new Set(creatures.map(c=>c.id));owned=new Set(ids.filter(id=>valid.has(id)));save();render();updateStats();$("status").textContent=t().importDone}catch(err){alert(t().importErr+err.message)}e.target.value=""});
 async function init(){loadSaved();applyLanguage();try{const response=await fetch("./creatures.json");if(!response.ok)throw new Error("HTTP "+response.status);const data=await response.json();if(!Array.isArray(data.creatures))throw new Error("creatures array missing");creatures=data.creatures;updateStats();render();$("status").textContent=t().loadok}catch(err){list.textContent=t().loaderr;$("status").textContent=t().statusErr+err.message}}
 init();
})();
</script></body></html>
