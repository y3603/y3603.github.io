
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ARK テイム補助ツール</title>

    <!-- jQuery -->
    <script src="./jquery-3.7.1.min.js"></script>
    <script src="./script.js"></script>
    <link rel="stylesheet" href="./style.css">

<script>
(function () {
  "use strict";
  try {
    /* 同じページに2回設置された場合、2回目は処理しない */
    if (window.__ninjaAdMaxAbdLoaded) { return; }
    window.__ninjaAdMaxAbdLoaded = true;

    /* ============== ここから編集可能 ============== */
    var CONFIG = {

      /* 表示メッセージ(2種類)
         検知のしかたに応じてどちらかが表示されます
         body に \n を入れるとその位置で改行されます */
      messages: {

        /* ページ上の広告枠が隠されていることを検知した場合。
           サイト単位の解除を案内します */
        forBlockerDetected: {
          title: "広告ブロッカーが有効になっています",
          body: "当サイトは広告収入により運営されています。" +
                "お手数ですが、広告ブロッカーの設定でこのサイト" +
                "(このドメイン)を許可リストに追加したうえで、" +
                "再読み込みボタンを押してください。"
        },

        /* 広告配信サーバーへの通信が失敗した場合。
           何が原因かまでは特定できないため、考えられる
           対処をまとめて案内します */
        forNetworkBlocked: {
          title: "広告がブロックされています",
          body: "当サイトは広告収入により運営されています。" +
                "ブラウザ拡張機能の広告ブロッカーをご利用の場合は、" +
                "このサイトを許可リストに追加してください。" +
                "DNS型・アプリ型のブロッカーをご利用の場合は、" +
                "一時的にオフにしたうえで再読み込みボタンを押してください。"
        }
      },

      /* ボタンの文言 */
      buttonText: "再読み込み",

      /* 背景の色(画面を覆う半透明の黒) */
      overlayColor: "rgba(0, 0, 0, 0.92)",

      /* ボタンの色 */
      buttonColor: "#1a73e8"
    };
    /* ============== ここまで編集可能 ============== */


    /* ---- 内部設定(変更しないでください) ---- */
    var INTERNAL = {
      admaxProbe: "https://adm.shinobi.jp/abd.js",
      baitClasses: "adsbox text-ad textAd ad-placement banner_ad",
      /* おとり要素に付ける id。class だけでなく id でも隠される
         ブロッカーがあるため両方を持たせる */
      baitId: "adsbox",
      /* 対照要素の class。広告を連想させる語を含めないこと
         (含めるとブロッカーが対照要素も隠し、検知が不発になる) */
      refClass: "content-ref-01"
    };

    /* 検知軸。bait / network のいずれか1つが陽性なら表示する */
    var axes = { bait: false, network: false };
    var overlayEl = null;         /* 表示済みの背景要素 */
    var messageShown = false;     /* メッセージを表示済みか */
    var baitSettled = false;      /* bait の判定が確定したか */
    var networkAbandoned = false; /* ネットワーク検知を中止したか */

    /* ネットワーク検知のシグナル。null = 未確定 */
    var signals = {
      admaxFetch: null,         /* true = admaxProbe への fetch が失敗 */
      admaxScript: null         /* true = admaxProbe の script 読み込みが失敗 */
    };

    /* DOM構築完了を待つ */
    function ready(fn) {
      if (document.readyState === "interactive" ||
          document.readyState === "complete") {
        fn();
      } else {
        document.addEventListener("DOMContentLoaded", fn, { once: true });
      }
    }

    function afterPaint(fn) {
      var guarded = function () {
        try { fn(); } catch (e) { }
      };
      if (typeof requestAnimationFrame !== "function") {
        setTimeout(guarded, 32);
        return;
      }
      requestAnimationFrame(function () {
        requestAnimationFrame(guarded);
      });
    }

    function removeEl(el) {
      if (el.parentNode) {
        el.parentNode.removeChild(el);
      }
    }

    /* 検知結果の集約。1軸でも陽性ならまず背景を出して閲覧を止め、
       bait の判定が確定してからメッセージを出す。
       network 軸は bait 軸より先に確定するため、先に表示すると
       文言が後から入れ替わることになる。それを避けるための2段構え */
    function escalate() {
      if (!axes.bait && !axes.network) { return; }
      showScrim();
      showMessage();
    }

    /* オーバーレイ背後をキーボード操作・読み上げの対象外にする */
    function deactivateBackground(overlay) {
      try {
        if (!document.body || !("inert" in HTMLElement.prototype)) { return; }
        var nodes = document.body.children;
        for (var i = 0; i < nodes.length; i++) {
          if (nodes[i] !== overlay) {
            nodes[i].inert = true;
          }
        }
      } catch (e) { }
    }

    /* 画面全体を覆う背景。メッセージより先に出して閲覧を止める */
    function showScrim() {
      if (overlayEl) { return; }

      var overlay = document.createElement("div");
      overlay.setAttribute("role", "dialog");
      overlay.setAttribute("aria-modal", "true");
      overlay.style.cssText =
        "position:fixed;top:0;left:0;width:100vw;" +
        "height:100vh;height:100dvh;" +
        "z-index:2147483647;overflow:auto;" +
        "display:flex;align-items:flex-start;justify-content:center;" +
        "padding:24px;box-sizing:border-box;";
      overlay.style.background = CONFIG.overlayColor;

      try {
        (document.body || document.documentElement).appendChild(overlay);
      } catch (e) {
        return;
      }

      overlayEl = overlay;
      deactivateBackground(overlay);
      document.documentElement.style.overflow = "hidden";
      if (document.body) {
        document.body.style.overflow = "hidden";
      }

      /* bait の判定が確定しないまま終わった場合の保険。
         背景だけ出て案内も再読み込みボタンも無い状態を残さない */
      setTimeout(function () {
        baitSettled = true;
        showMessage();
      }, 1500);
    }

    /* bait の判定確定後に、背景の中へメッセージを1回だけ出す */
    function showMessage() {
      if (!overlayEl || messageShown || !baitSettled) { return; }

      var msg = axes.bait ? CONFIG.messages.forBlockerDetected
                          : CONFIG.messages.forNetworkBlocked;
      var titleId = "admax-abd-title";
      var bodyId = "admax-abd-body";

      var box = document.createElement("div");
      box.style.cssText =
        "max-width:480px;margin:auto;background:#fff;border-radius:8px;" +
        "padding:32px 28px;text-align:center;" +
        "font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans'," +
        "'Noto Sans JP',Meiryo,sans-serif;color:#202124;";

      var title = document.createElement("div");
      title.id = titleId;
      title.textContent = msg.title;
      title.style.cssText =
        "font-size:18px;font-weight:700;margin-bottom:14px;line-height:1.5;";

      var body = document.createElement("div");
      body.id = bodyId;
      body.textContent = msg.body;
      body.style.cssText =
        "font-size:14px;line-height:1.8;margin-bottom:24px;" +
        "text-align:left;white-space:pre-wrap;";

      var btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = CONFIG.buttonText;
      btn.style.cssText =
        "display:inline-block;border:none;cursor:pointer;color:#fff;" +
        "font-size:15px;font-weight:600;padding:12px 32px;" +
        "border-radius:6px;";
      btn.style.background = CONFIG.buttonColor;
      btn.addEventListener("click", function () {
        try { location.reload(); } catch (e) { }
      });

      box.appendChild(title);
      box.appendChild(body);
      box.appendChild(btn);

      try {
        overlayEl.appendChild(box);
      } catch (e) {
        return;
      }

      messageShown = true;
      overlayEl.setAttribute("aria-labelledby", titleId);
      overlayEl.setAttribute("aria-describedby", bodyId);
      try { btn.focus(); } catch (e) { }
    }

    /* ---- bait軸: おとり要素による検知 ----
       広告風のclass名を付けた bait と、中立なclass名を付けた対照要素を
       同じスタイルで並べ、bait だけが非表示になった場合に陽性とする */
    var PROBE_STYLE =
      "position:absolute!important;left:-9999px!important;top:-9999px!important;" +
      "width:1px!important;height:1px!important;" +
      "display:block!important;visibility:visible!important;";

    function makeProbeEl(className) {
      var el = document.createElement("div");
      el.className = className;
      el.style.cssText = PROBE_STYLE;
      el.appendChild(document.createTextNode("\u00a0"));
      return el;
    }

    function isHidden(el) {
      var st = window.getComputedStyle(el);
      return el.offsetParent === null ||
             el.offsetHeight === 0 ||
             el.offsetWidth === 0 ||
             st.display === "none" ||
             st.visibility === "hidden";
    }

    function checkBait(recheck) {
      try {
        var host = document.body || document.documentElement;
        var bait = makeProbeEl(INTERNAL.baitClasses);
        var ref = makeProbeEl(INTERNAL.refClass);
        if (!document.getElementById(INTERNAL.baitId)) {
          bait.id = INTERNAL.baitId;
        }
        host.appendChild(bait);
        host.appendChild(ref);

        afterPaint(function () {
          var baitHidden, refHidden;
          try {
            baitHidden = isHidden(bait);
            refHidden = isHidden(ref);
          } finally {
            removeEl(bait);
            removeEl(ref);
          }
          if (baitHidden && !refHidden) {
            axes.bait = true;
          } else if (!recheck) {
            setTimeout(function () { checkBait(true); }, 1000);
            return;
          }
          baitSettled = true;
          escalate();
        });
      } catch (e) { }
    }

    /* ---- ネットワーク軸 ----
       広告配信サーバーへ到達できない場合を陽性とする。fetch と script の
       両方が失敗したことを条件にするのは、fetch 単独では 4xx/5xx と
       遮断を区別できないため。
       ただし遮断とは断定しない。配信側の障害・CSP・DNS・証明書・
       経路障害でも同じ観測になり、スクリプトからは区別できない。
       それでもこの軸単独で全面表示するのは、DNS 型ブロッカーの利用者が
       bait 軸に現れず、この軸でしか捕捉できないため             */
    function decideNetwork() {
      try {
        if (networkAbandoned || axes.network) { return; }
        if (signals.admaxFetch !== true) { return; }
        if (signals.admaxScript !== true) { return; }
        axes.network = true;
        escalate();
      } catch (e) { }
    }

    /* GET を使う。HEAD に変えないこと(理由は設計メモを参照) */
    function probeFetch(url) {
      return fetch(url, {
        method: "GET",
        mode: "no-cors",
        cache: "no-store",
        credentials: "omit"
      });
    }

    function checkNetwork() {
      if (typeof fetch !== "function") {
        networkAbandoned = true;
        return;
      }
      probeFetch(INTERNAL.admaxProbe).then(
        function () { signals.admaxFetch = false; decideNetwork(); },
        function () { signals.admaxFetch = true; decideNetwork(); }
      );
    }

    /* ---- script軸 ---- */
    function checkScript() {
      try {
        var s = document.createElement("script");
        s.src = INTERNAL.admaxProbe;
        s.async = true;
        /* 参照元のURLを送らない */
        s.referrerPolicy = "no-referrer";
        var settle = function (blocked) {
          signals.admaxScript = blocked;
          removeEl(s);
          decideNetwork();
        };
        s.onerror = function () { settle(true); };
        s.onload = function () { settle(false); };
        (document.head || document.documentElement).appendChild(s);
      } catch (e) { }
    }

    /* 実行開始: DOM構築 → 描画完了 → bait / network 並行で検知 */
    ready(function () {
      afterPaint(function () {
        checkBait(false);
        checkScript();
        checkNetwork();
      });
    });
  } catch (e) { /* このスクリプトが原因でサイトを壊さない */ }
})();
</script>

</head>

<body>

    <h1>ARK テイム補助ツール</h1>

    <p>ボタンを押した順番を最大6個まで記録します。</p>

    <!-- 入力結果 -->
    <div id="result">
        <div class="result-item"></div>
        <div class="result-item"></div>
        <div class="result-item"></div>
        <div class="result-item"></div>
        <div class="result-item"></div>
        <div class="result-item"></div>
    </div>

    <!-- 入力状況 -->
    <p id="message">0 / 6</p>

    <!-- A X C D ボタン -->
    <div class="button-area">
        <button class="key-button" id="btnA">A</button>
        <button class="key-button" id="btnX">X</button>
        <button class="key-button" id="btnC">C</button>
        <button class="key-button" id="btnD">D</button>
    </div>

    <!-- 操作ボタン -->
    <div class="control-area">
        <button id="undo">取り消す</button>
        <button id="clear">クリア</button>
    </div>


<!-- admax -->
<script src="https://adm.shinobi.jp/o/46bdd60fead631d8b98f45faf3e9c341"></script>
<!-- admax -->

</body>
</html>
