
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ARK テイム補助ツール</title>

    <!-- jQuery -->
    <script src="./jquery-3.7.1.min.js"></script>
    <script src="./script.js"></script>
    <link rel="stylesheet" href="./style.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7494979864899726" crossorigin="anonymous"></script>

</head>

<body>

    <h1>ARK テイム補助ツール</h1>

    <p>ボタンを押した順番を最大6個まで記録します。</p>

    <!-- 入力結果 -->
    <div id="result">
        <div class="result-item"></div>
        <div class="result-item"></div>
        <div class="result-item"></div>
        <div class="result-item"></div>
        <div class="result-item"></div>
        <div class="result-item"></div>
    </div>

    <!-- 入力状況 -->
    <p id="message">0 / 6</p>

    <!-- A X C D ボタン -->
    <div class="button-area">
        <button class="key-button" id="btnA">A</button>
        <button class="key-button" id="btnX">X</button>
        <button class="key-button" id="btnC">C</button>
        <button class="key-button" id="btnD">D</button>
    </div>

    <!-- 操作ボタン -->
    <div class="control-area">
        <button id="undo">取り消す</button>
        <button id="clear">クリア</button>
    </div>

</body>
</html>
